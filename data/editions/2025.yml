survey_note: >-
  En la encuesta posterior, el 86 % de quienes respondieron afirmó haber aprendido
  o mejorado habilidades, el 94 % presentó un juego y más del 99 % dijo que
  probablemente o definitivamente volvería a participar. La encuesta recibió
  4.108 respuestas voluntarias; los resultados no necesariamente representan a
  la totalidad de participantes.
