year: 2009
status: historica
intro: >-
  La primera Global Game Jam se celebró del 30 de enero al 1 de febrero de
  2009. En ese período, la jam era un proyecto de la International Game
  Developers Association (IGDA). Según el registro de GGJ, Argentina comenzó
  a participar en 2010.
dates: 30 de enero al 1 de febrero de 2009
theme:
  name: "As long as we have each other, we will never run out of problems"
  translation: Mientras nos tengamos los unos a los otros, nunca nos faltarán problemas
  note: >-
    Además del tema común, los juegos debían poder jugarse en cinco minutos o
    menos. Cada zona horaria recibió tres palabras y los equipos debían
    incorporar una de ellas.
