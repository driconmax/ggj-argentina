year: 2026
intro: >-
  La 17.ª Global Game Jam se desarrolló mundialmente entre el 26 de enero y
  el 1 de febrero de 2026. Cada sede pudo elegir dentro de esos seis días la
  ventana de 48 horas más conveniente para su comunidad.
dates: 26 de enero al 1 de febrero de 2026
theme:
  name: Mask
  translation: Máscara
  note: >-
    Según la explicación publicada por la directora ejecutiva Maria Burns
    Ortiz, el proceso de selección comenzó en octubre de 2025. Un comité
    voluntario internacional evaluó propuestas por sus posibilidades de
    diseño, similitud con temas anteriores, connotaciones culturales y
    asociaciones no deseadas. La opción seleccionada fue presentada al Board
    para su aprobación a comienzos de diciembre y luego pasó a producción y
    traducción para el anuncio global.
global_stats:
  participants: 39197
  sites: 824
  countries: 94
  games: 9874
stats_note: >-
