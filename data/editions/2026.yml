survey_note: >-
  La encuesta posterior registró que el 88 % de quienes respondieron aprendió
  o mejoró habilidades, el 94 % presentó un juego y más del 99 % afirmó que
  probablemente o definitivamente participaría nuevamente. La encuesta
  recibió 3.535 respuestas; estos porcentajes describen esa muestra voluntaria,
  no necesariamente a la totalidad de participantes.
