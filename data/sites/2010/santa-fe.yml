name: Global Game Jam Santa Fe 2010 — FICH-UNL
province: Santa Fe
locality: Santa Fe
audience: ggj
organization_id: santa-fe-ggj
format: Presencial
notes: >-
  La Facultad de Ingeniería y Ciencias Hídricas de la Universidad Nacional del
  Litoral y la Comunidad de Desarrolladores de Videojuegos de Santa Fe (CoDeViSa)
  organizaron la sede. Un documento de la UNL registra 35 participantes para 2010;
  otra memoria institucional informa 50 participantes y 10 juegos, pero coincide
  con cifras publicadas para 2011. Las cifras requieren corroboración.
  [Documento de la UNL](https://www.unl.edu.ar/wp-content/uploads/2018/05/Res-CS-106-20-Plan-de-estudios-TUIG.pdf) ·
  [Memoria institucional de la FICH](https://www.fich.unl.edu.ar/facultad/wp-content/uploads/sites/2/2022/06/Anexo_Res-130-11-Memoria_FICH_2010-1.pdf) ·
  [Crónica de 2011](https://www.unl.edu.ar/noticias/news/view/la_fich_fue_sede_del_global_game_jam_2011)
source: https://www.lt10.com.ar/noticia/30496--Se-viene-el-Global-Game-Jam%26seccion%3Dhoy
